name: Build IPA sem assinatura

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compilar sem assinatura Apple
        run: |
          set -euo pipefail
          xcodebuild \
            -project "ThreeOneOSFive.xcodeproj" \
            -scheme "3105" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/derived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Empacotar IPA sem assinatura
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/derived/Build/Products/Release-iphoneos/3105.app"
          test -d "$APP_PATH"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          zip -qry "$RUNNER_TEMP/3105-unsigned.ipa" Payload

      - name: Publicar IPA como artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3105-unsigned-ipa
          path: ${{ runner.temp }}/3105-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
